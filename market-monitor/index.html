<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://monitor-live.zzao.im; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    />
    <meta name="zzao-live-payload-url" content="https://monitor-live.zzao.im/v1/payload" />
    <meta name="zzao-live-challenge-url" content="https://monitor-live.zzao.im/v1/challenge" />
    <meta name="zzao-live-refresh-url" content="https://monitor-live.zzao.im/v1/refresh" />
    <title>市场杠杆与持仓风险监控</title>
    <link rel="icon" href="./favicon.ico?v=20260801-1" />
    <link rel="shortcut icon" href="./favicon.ico?v=20260801-1" />
    <link rel="stylesheet" href="./styles.css?v=20260811-1" />
    <script src="./unlock_security.js?v=20260806-1"></script>
    <script type="module" src="./app.js?v=20260811-1"></script>
  </head>
  <body>
    <main id="unlock-view" class="unlock-view">
      <section class="unlock-card" aria-labelledby="unlock-title">
        <div class="brand-mark" aria-hidden="true">
          <img src="./navi_logo.png" alt="" />
        </div>
        <p class="eyebrow">ZZAO · PRIVATE MONITOR</p>
        <h1 id="unlock-title">市场杠杆与持仓风险监控</h1>
        <p class="unlock-copy">
          数据以美东时间统计，单日窗口为 T-1 夜盘至 T 日盘后结束。
        </p>
        <form id="unlock-form" action="./" method="get" autocomplete="off">
          <label for="password">访问密码</label>
          <div class="password-row">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              inputmode="text"
              required
              autofocus
            />
            <button id="unlock-button" type="submit">解锁监控</button>
          </div>
          <p id="unlock-error" class="form-error" role="alert" aria-live="polite"></p>
        </form>
        <p class="security-note">
          密码只用于本机解密，不会被应用主动上传或保存；请勿把密码放入网址或分享。静态页面不提供服务器端身份认证。
        </p>
      </section>
    </main>

    <main id="dashboard" class="dashboard" hidden>
      <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
      <aside id="app-drawer" class="app-drawer" aria-label="主导航">
        <div class="drawer-topline">
          <div class="drawer-brand">
            <div class="brand-mark compact" aria-hidden="true">
              <img src="./navi_logo.png" alt="" />
            </div>
            <div class="drawer-brand-copy">
              <strong>ZZAO Monitor</strong>
              <span>Private workspace</span>
            </div>
          </div>
          <button id="drawer-toggle" class="icon-button drawer-toggle" type="button" aria-label="收起导航" aria-expanded="true">☰</button>
        </div>

        <nav class="drawer-nav" aria-label="监控功能">
          <p class="drawer-group-label">风险监控</p>
          <button id="nav-personal" class="drawer-item" type="button" aria-current="page" data-view="personal">
            <span class="drawer-icon" aria-hidden="true">◎</span>
            <span class="drawer-label">持仓风险</span>
            <span id="personal-tab-alert" class="tab-count"></span>
          </button>
          <button id="nav-macro" class="drawer-item" type="button" data-view="macro">
            <span class="drawer-icon" aria-hidden="true">⌁</span>
            <span class="drawer-label">宏观与板块</span>
            <span id="macro-tab-alert" class="tab-count"></span>
          </button>
          <p class="drawer-group-label">交易分析</p>
          <button id="nav-trading" class="drawer-item" type="button" data-view="trading">
            <span class="drawer-icon" aria-hidden="true">↗</span>
            <span class="drawer-label">交易复盘</span>
            <span id="trading-source-alert" class="tab-count"></span>
          </button>
        </nav>

        <div class="drawer-footer">
          <div class="currency-control" role="group" aria-label="金额显示币种">
            <button class="currency-option" type="button" data-currency="USD" aria-pressed="true">USD</button>
            <button class="currency-option" type="button" data-currency="CNY" aria-pressed="false">CNY</button>
          </div>
          <button id="theme-button" class="drawer-utility" type="button">
            <span id="theme-icon" class="drawer-icon" aria-hidden="true">◐</span>
            <span id="theme-label" class="drawer-label">跟随系统</span>
          </button>
          <button id="lock-button" class="drawer-utility" type="button">
            <span class="drawer-icon" aria-hidden="true">⌁</span>
            <span class="drawer-label">锁定页面</span>
          </button>
        </div>
      </aside>

      <div class="app-main">
        <header class="dashboard-header">
          <div class="header-title-row">
            <button id="mobile-menu-button" class="icon-button mobile-menu-button" type="button" aria-label="打开导航" aria-controls="app-drawer" aria-expanded="false">☰</button>
            <div>
              <p id="page-eyebrow" class="eyebrow">PORTFOLIO RISK</p>
              <h1 id="page-title">持仓风险</h1>
              <p id="page-subtitle" class="page-subtitle">组合杠杆、风险预算与持仓行动</p>
            </div>
          </div>
          <div class="header-actions">
            <span id="snapshot-status" class="status-pill"></span>
          </div>
        </header>
        <div id="asof-line" class="asof-line"></div>
        <section id="portfolio-overview" class="portfolio-overview" aria-label="资产增长概览"></section>

        <section id="panel-personal" class="view-panel" aria-labelledby="nav-personal">
          <div id="personal-content"></div>
        </section>
        <section id="panel-macro" class="view-panel" aria-labelledby="nav-macro" hidden>
          <div id="macro-content"></div>
        </section>
        <section id="panel-trading" class="view-panel" aria-labelledby="nav-trading" hidden>
          <div id="trading-content"></div>
        </section>

        <footer>
          <p>本页面是风险管理辅助工具，不自动下单。事实、推断和行动条件应分别复核；缺失数据不按零处理。</p>
        </footer>
      </div>
    </main>
  </body>
</html>
